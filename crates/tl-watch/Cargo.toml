[package]
name = "tl-watch"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The low-memory watcher, installed as /usr/bin/tasklens-watch (E32, tasklens-m1f.19).
# std and libc only, so the locked process stays under 4 MiB RSS.
[[bin]]
name = "tasklens-watch"
path = "src/main.rs"

[dependencies]
libc = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
