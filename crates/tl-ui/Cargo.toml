[package]
name = "tl-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
tl-model = { workspace = true }
tl-ui-settings = { workspace = true }
tl-ui-base = { workspace = true }
gpui-kit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
async-channel = { workspace = true }
jiff = { workspace = true }
fluent-bundle = { workspace = true }
intl_pluralrules = { workspace = true }
unic-langid = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }   # render-tests only (R-291)
unicode-segmentation = { workspace = true }

[dev-dependencies]
tl-ui-testkit = { workspace = true }   # FakeEngine; render helpers with `render-tests`
gpui-kit = { workspace = true, features = ["test-support"] }
fastrand = "2.5"   # seeded noise for render_chart goldens (tasklens-yrf.13)
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
bench = ["test-hooks", "gpui-kit/profiler"]     # frame histograms and paint log for --bench (ADR-014, E01-OI-6)
render-tests = ["bench", "gpui-kit/test-support", "dep:image", "tl-ui-testkit/render"]   # headless screenshot tests (ADR-013)
test-hooks = ["tl-ui-base/test-hooks"]

[lints]
workspace = true
