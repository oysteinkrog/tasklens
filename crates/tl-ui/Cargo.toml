[package]
name = "tl-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
tl-model = { workspace = true }
gpui-kit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
async-channel = { workspace = true }
jiff = { workspace = true }
fluent-bundle = { workspace = true }
unic-langid = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }   # render-tests only (R-291)
unicode-segmentation = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }

[features]
default = []
bench = ["gpui-kit/profiler"]     # frame histograms for --bench (ADR-014)
render-tests = ["bench", "gpui-kit/test-support", "dep:image"]   # headless screenshot tests (ADR-013)
test-hooks = []

[lints]
workspace = true
