[package]
name = "tl-gpu-probe"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "tl-gpu-probe"
path = "src/main.rs"

[dependencies]
tl-model = { workspace = true }
nvml-wrapper = { workspace = true }
rustix = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
# Loaded at run time, only for the --api-versions mode.
ash = { workspace = true, optional = true, features = ["loaded"] }
khronos-egl = { workspace = true, optional = true, features = ["dynamic", "1_5"] }

[features]
default = ["api-versions"]
# The --api-versions mode.
api-versions = ["dep:ash", "dep:khronos-egl"]
# The --fake <script> backend for engine tests.
fake = []

[lints]
workspace = true
