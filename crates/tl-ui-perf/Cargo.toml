[package]
name = "tl-ui-perf"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
tl-model = { workspace = true }
gpui-kit = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
jiff = { workspace = true }
fluent-bundle = { workspace = true }
tl-ui-overview = { workspace = true }
tl-ui-perf-core = { workspace = true }
tl-ui-chart = { workspace = true }
tl-ui-table = { workspace = true }
tl-ui-kit = { workspace = true }
tl-ui-base = { workspace = true }
tl-ui-settings = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tl-ui-testkit = { workspace = true }   # FakeEngine for the integration tests
tl-ui-pagehost = { workspace = true, features = ["test-support"] }   # render helpers

[features]
default = []
bench = []
test-hooks = []
render-tests = ["tl-ui-pagehost/render-tests", "test-hooks"]   # headless screenshot tests (ADR-013)

[[test]]
name = "render"
path = "tests/render/main.rs"
required-features = ["render-tests"]

[lints]
workspace = true
