[package]
name = "tl-engine"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
tl-model      = { workspace = true }
tl-collect    = { workspace = true }
tl-ops        = { workspace = true }
asupersync    = { workspace = true }
arc-swap      = { workspace = true }
async-channel = { workspace = true }
zbus          = { workspace = true }
futures-lite  = { workspace = true }
rustix        = { workspace = true }
postcard      = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
rustc-hash    = { workspace = true }
smallvec      = { workspace = true }
bitflags      = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }

[dev-dependencies]
asupersync = { workspace = true, features = ["proc-macros", "test-internals"] }
# `p2p` builds a bus-free connection over a socketpair for the `ManagerConnSlot` test.
zbus       = { workspace = true, features = ["p2p"] }

[lints]
workspace = true
