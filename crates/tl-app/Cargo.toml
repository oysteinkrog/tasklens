[package]
name = "tl-app"
edition.workspace = true
version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "tasklens"
path = "src/main.rs"

[dependencies]
tl-model  = { workspace = true }
tl-engine = { workspace = true }
tl-ui     = { workspace = true }
tl-ops    = { workspace = true }   # write_atomic (R-130)
tl-tray   = { workspace = true }   # tray thread (E31-008)
tl-remote = { workspace = true }   # the engine service client (ADR-018)
zbus      = { workspace = true }
toml      = { workspace = true }
serde     = { workspace = true }
anyhow    = { workspace = true }
tracing   = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
rustix    = { workspace = true }
clap          = { workspace = true }   # R-142 item 1
async-channel = { workspace = true }   # R-142 item 2
serde_json    = { workspace = true }   # themes.json and run-history.json (R-245)
# Rendering GPU adapter probe (R-142). The version GPUI already uses, default features.
wgpu          = { version = "=29.0.4" }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# tests/live_processes.rs: the real engine wired to the UI (tasklens-pdu.52)
gpui-kit   = { workspace = true, features = ["test-support"] }
tl-ui      = { workspace = true, features = ["test-hooks"] }
tl-collect = { workspace = true }

[features]
bench = ["tl-ui/bench"]   # ADR-002; release builds do not enable it

[lints]
workspace = true
