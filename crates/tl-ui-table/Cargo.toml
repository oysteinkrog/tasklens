[package]
name = "tl-ui-table"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
tl-model = { workspace = true }
tl-ui-settings = { workspace = true }
gpui-kit = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
fluent-bundle = { workspace = true }
tl-ui-base = { workspace = true }
tl-ui-kit = { workspace = true }

[dev-dependencies]
tl-ui-testkit = { workspace = true }
tl-ui-pagehost = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
default = []
test-hooks = []
render-tests = ["tl-ui-pagehost/render-tests"]   # headless screenshot tests (ADR-013)

[[test]]
name = "render"
path = "tests/render/main.rs"
required-features = ["render-tests"]

[lints]
workspace = true
