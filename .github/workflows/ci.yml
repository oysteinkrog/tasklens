name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libfontconfig1-dev libvulkan1 mesa-vulkan-drivers

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup show

      - name: Run scripts/ci.sh
        run: scripts/ci.sh
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
